   <g id="text_21">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202731" x="352.787368" y="430.49099" transform="rotate(-0 352.787368 430.49099)">9/16</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202731" x="496.471579" y="483.729255" transform="rotate(-0 496.471579 483.729255)">16/16</text>
   </g>
  </g>
  <g id="text_23">
   <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202731" x="7.2" y="18.597656" transform="rotate(-0 7.2 18.597656)">Local score gains did not ensure more completions</text>
  </g>
  <g id="text_24">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #202731" transform="translate(7.2 38.28)">Frozen main campaign. These panels evaluate different populations.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #202731" transform="translate(7.2 53.28)">Top: 128 fixed states, eight families. Bottom: eight equations, two seeds.</text>
  </g>
  <g id="text_25">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #202731" transform="translate(7.2 542.28)">Assisted menus guarantee a reference-best action using external solver assistance.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #202731" transform="translate(7.2 557.28)">That 16/16 result is not evidence of a model capability gain. Intervals are pointwise and exploratory.</text>
  </g>
 </g>
